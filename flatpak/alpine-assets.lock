# alpine-bin/ and alpine-src/ are too large for git (~500 MB); they ship as
# GitHub release assets of this repo. Restore before an offline build:
#   gh release download flatpak-alpine3.24-2026.10.05 -R MatonOS-dev/MatonOS_apexs -D /tmp/a
#   (cd /tmp/a && sha256sum -c SHA256SUMS)
#   zstd -dc /tmp/a/alpine-bin-x86_64.tar.zst | tar -x -C flatpak/
#   zstd -dc /tmp/a/alpine-src.tar.zst | tar -x -C flatpak/
# fetch-apks.sh regenerates them from Alpine 3.24 (then apk.lock changes).
release flatpak-alpine3.24-2026.10.05
ea2aecdc5a37c8cadfe76ca4b1288fcb22c502e561af10833c50accffdadbcef  alpine-bin-x86_64.tar.zst
2722f235edf036af03bf4b3771346d08d222b75e35e30da967ef80593da519f0  alpine-src.tar.zst
